# deploy/nginx/catch-all.conf — the server's DEFAULT site: a hostname that has
# no site of its own gets no page at all.
#
# Why: nginx answers a hostname it doesn't know with the FIRST site in
# alphabetical order. After a trip is torn down (or for a DNS name that was
# never set up, or a typo), that meant the admin hub's page under a
# certificate warning. With this file, such a request is simply dropped:
#   http://  -> connection closed with no answer (nginx code 444)
#   https:// -> the TLS handshake is refused (no certificate is shown at all)
# Every site reached by a NAME keeps working: it names itself in server_name,
# and a request for a known name never reaches this default.
#
# NOT for a bare-IP install (setup-https.sh CERT_MODE=ip, server_name = the
# IP): a browser sends no name when it connects to an IP, so https by IP always
# lands on the default site — this one — and is refused. The trip fleet is
# name-based (new-trip.sh), so it is unaffected.
#
# Install (on the server, supervised):
#   cp catch-all.conf /etc/nginx/sites-available/000-catch-all
#   ln -s /etc/nginx/sites-available/000-catch-all /etc/nginx/sites-enabled/000-catch-all
#   nginx -t && systemctl reload nginx
# Before installing, run these three ON the server (an ssh session, or inside
# an `ssh <server> bash -s <<'EOF'` block — not wrapped in ssh "..." quotes).
# The first two must print nothing; the third must show the same number twice,
# and not 0 ("0 of 0" means the commands ran somewhere without these folders):
#   grep -RnE --exclude='.*' '^[^#]*listen[^;]*[[:space:]]default(_server)?([[:space:];]|$)' /etc/nginx/sites-enabled/ /etc/nginx/conf.d/
#     (a second default site — "default_server" or the older "default" — on one port fails nginx -t)
#   grep -RnE --exclude='.*' '^[^#]*server_name[^;]*[[:space:]]([0-9]{1,3}\.){3}[0-9]{1,3}' /etc/nginx/sites-enabled/ /etc/nginx/conf.d/
#     (a site served by bare IP — anywhere in its server_name — would stop working, see above)
#   echo "files read: $(grep -Rc --exclude='.*' '' /etc/nginx/sites-enabled/ | wc -l) of $(ls /etc/nginx/sites-enabled/ | wc -l)"
#     (proof the searches opened every file nginx loads there; a broken symlink shows as one short)
# Capital -R, never -r: the entries in sites-enabled are symlinks, and grep -r
# does not follow them — with -r the checks print nothing because they read
# nothing. --exclude='.*' skips hidden files (editor leftovers), which nginx's
# "include sites-enabled/*" skips too; ^[^#]* ignores commented-out lines
# (Ubuntu's stock "default" site has some). Not covered: a site reached by bare IP
# only because it loads first on its port, and a server_name split across
# lines. On a fresh Ubuntu install the first check finds the stock "default"
# site — remove its link (rm /etc/nginx/sites-enabled/default) first. (Once
# this file is installed, the first check finds it.)
#
# The 443 listen lines carry the same "ssl http2" options as the trip sites
# (deploy/nginx/trip-dashboard.conf.template). tools/catchall-rehearsal.sh
# checks nginx -t passes with no "protocol options redefined" warning next to a
# trip site. (The server already shows that warning for two existing sites;
# its cause is not known — compare the count before and after installing.)
# Needs nginx 1.19.4+ for ssl_reject_handshake (Ubuntu 24.04 ships 1.24).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
