<style>
*{font-family:'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.display{font-family:'Playfair Display',serif}
::-webkit-scrollbar{display:none}
*{-ms-overflow-style:none;scrollbar-width:none}
input,select,textarea{font-size:16px}
body{background:#F0F2F5;overscroll-behavior:none}
.pulse-dot{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Rev 45: print / Save-as-PDF of the full itinerary ── */
.print-doc{display:none}
@media screen{#print-portal{display:none}}
@media print{
  #root{display:none !important}
  #print-portal{display:block !important}
  html,body{background:#fff !important}
  @page{margin:1.4cm}
  .print-doc{display:block;color:#111;font-family:'DM Sans',Arial,sans-serif;font-size:10.5pt;line-height:1.4}
  .print-doc *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-head{border-bottom:3px solid #0D2B4E;padding-bottom:8pt;margin-bottom:14pt}
  .ph-title{font-family:'Playfair Display',serif;font-size:24pt;font-weight:900;color:#0D2B4E;line-height:1.05}
  .ph-sub{font-size:11pt;color:#444;margin-top:3pt}
  .ph-meta{font-size:10pt;color:#666;margin-top:5pt;font-weight:600}
  .print-day{page-break-inside:avoid;margin-bottom:13pt}
  .pd-head{page-break-after:avoid;display:flex;align-items:baseline;gap:8pt;border-bottom:1.5pt solid #0D2B4E;padding-bottom:3pt;margin-bottom:5pt}
  .pd-num{font-size:9pt;font-weight:800;color:#fff;background:#0D2B4E;border-radius:4pt;padding:1.5pt 6pt;white-space:nowrap}
  .pd-loc{font-family:'Playfair Display',serif;font-size:14pt;font-weight:700;color:#0D2B4E;flex:1}
  .pd-date{font-size:10pt;font-weight:700;color:#888;white-space:nowrap}
  .pd-meta{font-size:9pt;color:#777;margin:0 0 4pt;font-weight:600}
  .pd-note{font-size:9pt;color:#7c5c00;background:#FFF7E6;border:0.75pt solid #F0D98A;border-radius:5pt;padding:4pt 7pt;margin:0 0 6pt}
  .pd-empty{font-size:9.5pt;color:#aaa;font-style:italic;padding:2pt 0 4pt}
  .pd-table{width:100%;border-collapse:collapse}
  .pd-table tr{page-break-inside:avoid}
  .pd-time{width:74pt;vertical-align:top;font-weight:700;color:#0D2B4E;font-size:9.5pt;padding:3pt 8pt 3pt 0;white-space:nowrap;border-bottom:0.5pt solid #EEE}
  .pd-title{vertical-align:top;font-size:10pt;color:#1a1a1a;padding:3pt 0;border-bottom:0.5pt solid #EEE}
  .pd-who{color:#888;font-size:8.5pt;font-weight:600}
  .print-summary{page-break-before:always;margin-top:4pt}
  .ps-h{font-family:'Playfair Display',serif;font-size:16pt;font-weight:800;color:#0D2B4E;border-bottom:1.5pt solid #0D2B4E;padding-bottom:4pt;margin-bottom:8pt}
  .ps-person{page-break-inside:avoid;margin-bottom:9pt}
  .ps-name{font-size:11pt;font-weight:800;color:#0D2B4E;margin-bottom:2pt}
  .ps-count{font-weight:600;color:#999;font-size:9.5pt}
  .ps-item{display:block;font-size:9.5pt;color:#222;padding:1.5pt 0;border-bottom:0.5pt solid #F0F0F0}
  .ps-star{color:#C9A227;font-weight:700}
  .ps-day{color:#888;font-size:8.5pt}
  .print-foot{margin-top:16pt;padding-top:6pt;border-top:0.75pt solid #CCC;font-size:8pt;color:#999;text-align:center}
}
</style>

<script>
const API = '';
const OUTBOX_KEY = 'tg_outbox';
function _obGet() {
  try {
    return JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]');
  } catch (e) {
    return [];
  }
}
function _obSet(q) {
  try {
    localStorage.setItem(OUTBOX_KEY, JSON.stringify(q));
  } catch (e) {}
}
async function qfetch(url, opts) {
  opts = opts || {};
  if (opts.method && opts.method !== 'GET') {
    opts.headers = Object.assign({}, opts.headers);
    if (!opts.headers['X-Op-Id']) opts.headers['X-Op-Id'] = window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : 'op-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    try {
      const _t = localStorage.getItem('tg_token');
      if (_t && !opts.headers['X-Auth-Token']) opts.headers['X-Auth-Token'] = _t;
    } catch (e) {}
  }
  try {
    const r = await fetch(url, opts);
    if (r && r.status === 401 && opts.method && opts.method !== 'GET') {
      try {
        localStorage.removeItem('tg_name');
        localStorage.removeItem('tg_token');
      } catch (e) {}
      try {
        location.reload();
      } catch (e) {}
    }
    return r;
  } catch (e) {
    if (opts.method && opts.method !== 'GET') {
      const q = _obGet();
      q.push({
        u: url,
        o: opts
      });
      _obSet(q);
      try {
        window.dispatchEvent(new CustomEvent('tg-sync', {
          detail: {
            type: 'queued'
          }
        }));
      } catch (_e) {}
    }
    return null;
  }
}
async function flushOutbox() {
  if (!navigator.onLine) return 0;
  let q = _obGet();
  if (!q.length) return 0;
  const keep = [];
  let sent = 0;
  for (let i = 0; i < q.length; i++) {
    const it = q[i];
    try {
      const r = await fetch(it.u, it.o);
      if (r && r.status === 401) {
        // Stale/dead token: this write can never succeed — drop it instead of
        // retrying forever. If the session itself is gone, the rest of the
        // queue is doomed too (items carry their token), so stop flushing.
        let tok = null;
        try {
          tok = localStorage.getItem('tg_token');
        } catch (_e) {}
        if (!tok) {
          break;
        }
